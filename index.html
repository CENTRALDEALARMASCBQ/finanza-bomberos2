<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de ingresos y egresos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2a3a;--mut:#667;--hd:#26394d;--hdt:#fff;--bd:#d5dbe3;--ok:#1a7f4b;--no:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#131a22;--card:#1c2631;--tx:#e8edf2;--mut:#9aa6b2;--hd:#2c4259;--bd:#334455;--ok:#4cc38a;--no:#ff7b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#131a22;--card:#1c2631;--tx:#e8edf2;--mut:#9aa6b2;--hd:#2c4259;--bd:#334455;--ok:#4cc38a;--no:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Segoe UI,Arial,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 10px}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.big{font-size:22px;font-weight:700}.mut{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.acc{padding:0;overflow:hidden;cursor:pointer}.acc .h{background:var(--hd);color:var(--hdt);padding:8px 10px;font-weight:600;font-size:13px}
.acc .b{padding:8px 10px;font-size:13px}.acc .b div{display:flex;justify-content:space-between;gap:6px;margin:2px 0}
.acc.sel{outline:2px solid var(--ok)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
input,select,button{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0;width:100%}
button{background:var(--hd);color:var(--hdt);border:0;cursor:pointer;font-weight:600}button.s{width:auto;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{background:var(--hd);color:var(--hdt);text-align:left;padding:7px;position:sticky;top:0}td{padding:6px 7px;border-bottom:1px solid var(--bd)}
.r{text-align:right;white-space:nowrap}.i{color:var(--ok)}.e{color:var(--no)}.x{background:none;color:var(--no);width:auto;padding:2px 6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.bar select{width:auto}
</style></head><body>
<h1>Registro de ingresos y egresos</h1>
<div class="top">
 <div class="card"><div class="mut">Saldo banco (actual)</div><div class="big" id="bank"></div>
  <label>Saldo inicial del banco<input id="bankIni" inputmode="numeric"></label></div>
 <div class="card"><div class="mut">Suma de cuentas</div><div class="big" id="sum"></div><div class="mut" id="diff"></div></div>
 <div class="card"><div class="mut">Ingresos / Egresos del registro</div><div class="i" id="tin"></div><div class="e" id="teg"></div></div>
</div>
<h2>Desglose de recursos <span class="mut">(toca una cuenta para filtrar)</span></h2>
<div class="grid" id="accs"></div>
<div class="card" style="margin-bottom:14px"><h2>Nuevo movimiento</h2>
<form id="f">
 <label>Fecha<input type="date" id="fe" required></label>
 <label>Proveedor / cuenta<select id="ac"></select></label>
 <label>Tipo<select id="ti"><option value="e">Egreso (resta)</option><option value="i">Ingreso (suma)</option></select></label>
 <label>Monto $<input id="mo" inputmode="numeric" required placeholder="0"></label>
 <label>Detalle<input id="de" required></label>
 <label>Categoría<input id="ca" list="cats" placeholder="alimentación, mantenciones…"></label>
 <label>Factura<input id="fa"></label><label>Boleta<input id="bo"></label><label>Cheque N°<input id="ch"></label>
 <button>Agregar</button>
</form></div>
<div class="bar"><h2 style="margin:0">Movimientos</h2>
 <select id="flt"></select><input id="q" placeholder="Buscar detalle…" style="width:180px">
 <button class="s" id="csv">Descargar CSV</button><button class="s" id="rst">Borrar todo</button></div>
<div class="card w"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th>Detalle</th><th>Categoría</th><th>Fact.</th><th>Bol.</th><th>Cheque</th><th class="r">Ingreso $</th><th class="r">Egreso $</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<datalist id="cats"><option>alimentación<option>mantenciones<option>combustible<option>proyecto<option>donaciones<option>reparaciones<option>revisión técnica</datalist>
<script>
const NAMES=["Ingresos propios","Primera compañía","Segunda compañía","Tercera compañía","Acreencias bancarias","Ayuda extraordinaria","Operaciones","Inversiones","Artículo 45","Subvención municipal"];
const INI=[2968782,8573432,804260,2758204,60727489,0,0,0,0,0];
const K="planilla2026";let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={bank:112906081,ini:INI.slice(),moves:[]};
let sel="";
const $=id=>document.getElementById(id);
const fm=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-CL");
const num=v=>parseInt(String(v).replace(/[^\d-]/g,""))||0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tot(n){let i=0,e=0;S.moves.forEach(m=>{if(m.a===n){m.t==="i"?i+=m.m:e+=m.m}});return{i,e}}
function render(){
 let TI=0,TE=0;S.moves.forEach(m=>m.t==="i"?TI+=m.m:TE+=m.m);
 const bank=S.bank+TI-TE;$("bank").textContent=fm(bank);
 let sum=0;
 $("accs").innerHTML=NAMES.map((n,k)=>{const t=tot(n),s=S.ini[k]+t.i-t.e;sum+=s;
  return`<div class="card acc ${sel===n?"sel":""}" data-n="${esc(n)}"><div class="h">${esc(n)}</div><div class="b"><div><span>Saldo inicial</span><input class="ini" data-k="${k}" value="${S.ini[k].toLocaleString("es-CL")}" onclick="event.stopPropagation()" style="width:90px;text-align:right;padding:2px 4px"></div><div><span>Ingresos</span><span class="i">${fm(t.i)}</span></div><div><span>Egresos</span><span class="e">${fm(t.e)}</span></div><div><b>Saldo total</b><b class="${s<0?"e":""}">${fm(s)}</b></div></div></div>`}).join("");
 $("sum").textContent=fm(sum);$("diff").textContent="Diferencia con banco: "+fm(bank-sum);
 $("tin").textContent="Ingresos: "+fm(TI);$("teg").textContent="Egresos: "+fm(TE);
 const q=$("q").value.toLowerCase();
 const rows=S.moves.map((m,k)=>({...m,k})).filter(m=>(!sel||m.a===sel)&&(!q||(m.d+m.c).toLowerCase().includes(q))).sort((a,b)=>b.f.localeCompare(a.f)||b.k-a.k);
 $("tb").innerHTML=rows.map(m=>`<tr><td>${m.f.split("-").reverse().join("-")}</td><td>${esc(m.a)}</td><td>${esc(m.d)}</td><td>${esc(m.c)}</td><td>${esc(m.fa)}</td><td>${esc(m.bo)}</td><td>${esc(m.ch)}</td><td class="r i">${m.t==="i"?fm(m.m):""}</td><td class="r e">${m.t==="e"?fm(m.m):""}</td><td><button class="x" data-del="${m.k}" title="Eliminar">✕</button></td></tr>`).join("")||`<tr><td colspan="10" class="mut">Sin movimientos todavía.</td></tr>`;
 $("bankIni").value=S.bank.toLocaleString("es-CL");
}
$("ac").innerHTML=NAMES.map(n=>`<option>${n}</option>`).join("");
$("flt").innerHTML='<option value="">Todas las cuentas</option>'+NAMES.map(n=>`<option>${n}</option>`).join("");
$("fe").value=new Date().toISOString().slice(0,10);
$("f").onsubmit=e=>{e.preventDefault();const m=Math.abs(num($("mo").value));if(!m)return;
 S.moves.push({f:$("fe").value,a:$("ac").value,t:$("ti").value,m,d:$("de").value,c:$("ca").value,fa:$("fa").value,bo:$("bo").value,ch:$("ch").value});
 save();["mo","de","ca","fa","bo","ch"].forEach(i=>$(i).value="");render()};
$("accs").onclick=e=>{const c=e.target.closest(".acc");if(!c)return;sel=sel===c.dataset.n?"":c.dataset.n;$("flt").value=sel;render()};
$("accs").onchange=e=>{if(e.target.classList.contains("ini")){S.ini[+e.target.dataset.k]=num(e.target.value);save();render()}};
$("bankIni").onchange=e=>{S.bank=num(e.target.value);save();render()};
$("flt").onchange=e=>{sel=e.target.value;render()};$("q").oninput=render;
$("tb").onclick=e=>{const k=e.target.dataset.del;if(k!==undefined&&confirm("¿Eliminar este movimiento?")){S.moves.splice(+k,1);save();render()}};
$("rst").onclick=()=>{if(confirm("¿Borrar todos los movimientos?")){S.moves=[];save();render()}};
$("csv").onclick=()=>{const h="Fecha;Proveedor;Detalle;Categoría;Factura;Boleta;Cheque;Ingreso;Egreso\n";
 const b=h+S.moves.map(m=>[m.f,m.a,m.d,m.c,m.fa,m.bo,m.ch,m.t==="i"?m.m:"",m.t==="e"?m.m:""].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,\ufeff"+encodeURIComponent(b);a.download="movimientos.csv";a.click()};
render();
</script></body></html>
